<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoggoЧат</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
:root{--tg-blue:#3390ec;--tg-blue-dark:#2481d7;--glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.78);--glass-border:rgba(255,255,255,.55);--text:#0d1b2a;--text-soft:#708499;--chat-bg:rgba(230,240,255,.35);--bubble-in:rgba(255,255,255,.92);--shadow:0 8px 32px rgba(31,58,120,.22)}
body.dark{--glass:rgba(20,30,55,.6);--glass-strong:rgba(15,25,50,.85);--glass-border:rgba(120,160,230,.22);--text:#eaf1ff;--text-soft:#8fa4c4;--chat-bg:rgba(10,18,35,.5);--bubble-in:rgba(35,50,80,.9);--shadow:0 8px 32px rgba(0,0,0,.5)}
body{min-height:100vh;color:var(--text);background:linear-gradient(135deg,#0d1b3e,#1e3c72 45%,#2a5298);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
body.light-bg{background:linear-gradient(135deg,#7ba7e8,#4a7bc8 45%,#8fb8f0)}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;pointer-events:none}
.blob.b1{width:420px;height:420px;background:#4a7bc8;top:-120px;left:-100px;animation:f1 14s ease-in-out infinite}
.blob.b2{width:380px;height:380px;background:#7ba7e8;bottom:-140px;right:-80px;animation:f2 17s ease-in-out infinite}
.blob.b3{width:300px;height:300px;background:#8fb8f0;top:40%;right:20%;animation:f3 20s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,80px) scale(1.15)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,-60px) scale(1.1)}}
@keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,70px)}}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--shadow);position:relative}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%)}
.auth-wrap{position:relative;z-index:2;width:100%;display:flex;justify-content:center;align-items:center;height:100vh;padding:20px}
.auth-card{width:400px;padding:42px 34px;border-radius:28px;animation:popIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.auth-card h1{text-align:center;font-size:32px;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--tg-blue),#7ba7e8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.auth-card .sub{text-align:center;color:var(--text-soft);font-size:13px;margin-bottom:26px}
.field{width:100%;padding:14px 18px;margin-bottom:12px;font-size:14px;background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:14px;color:var(--text);outline:none;transition:.25s}
.field::placeholder{color:var(--text-soft)}
.field:focus{border-color:var(--tg-blue);box-shadow:0 0 0 4px rgba(51,144,236,.18)}
.btn-primary{width:100%;padding:15px;border:none;border-radius:14px;cursor:pointer;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--tg-blue),var(--tg-blue-dark));box-shadow:0 8px 24px rgba(51,144,236,.45);transition:.25s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(51,144,236,.6)}
.switch-link{text-align:center;margin-top:18px;font-size:13px;color:var(--text-soft)}
.switch-link a{color:var(--tg-blue);font-weight:700;cursor:pointer}
.err{text-align:center;font-size:13px;min-height:20px;margin-bottom:8px;font-weight:600}
.hidden{display:none!important}
.app{position:relative;z-index:2;width:min(1060px,96vw);height:min(700px,94vh);border-radius:24px;display:flex;overflow:hidden;padding:10px;gap:10px;animation:popIn .5s cubic-bezier(.2,.9,.3,1.2)}
.sidebar{width:340px;display:flex;flex-direction:column;border-radius:18px;overflow:hidden}
.side-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:19px;font-weight:800;background:linear-gradient(135deg,var(--tg-blue),#7ba7e8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.head-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass-strong);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.2s;color:var(--text)}
.icon-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(51,144,236,.3)}
.my-avatar{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid rgba(255,255,255,.5);transition:.2s}
.my-avatar:hover{transform:scale(1.08)}
.search-row{padding:4px 14px 10px}
.search-row input{width:100%;padding:10px 16px;border-radius:20px;font-size:13px;border:1px solid var(--glass-border);background:var(--glass-strong);color:var(--text);outline:none;transition:.2s}
.search-row input:focus{border-color:var(--tg-blue);box-shadow:0 0 0 3px rgba(51,144,236,.15)}
.tabs{display:flex;gap:4px;padding:0 14px 10px}
.tab{flex:1;padding:9px;text-align:center;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text-soft);transition:.2s;border:1px solid transparent}
.tab.active{color:#fff;background:linear-gradient(135deg,var(--tg-blue),var(--tg-blue-dark));box-shadow:0 4px 14px rgba(51,144,236,.4)}
.tab:not(.active):hover{background:rgba(255,255,255,.3)}
.list{flex:1;overflow-y:auto;padding:0 8px 8px}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:rgba(51,144,236,.4);border-radius:3px}
.item{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:2px;border-radius:14px;cursor:pointer;transition:.18s;position:relative}
.item:hover{background:rgba(255,255,255,.35)}
.item.active{background:rgba(51,144,236,.22);box-shadow:inset 0 0 0 1px var(--glass-border)}
.av{width:48px;height:48px;border-radius:50%;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.av .dot{position:absolute;bottom:0;right:0;width:13px;height:13px;border-radius:50%;background:#2ecc71;border:2.5px solid var(--glass-strong)}
.av .dot.offline{background:#aaa;box-shadow:none}
.av .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3b5c;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--glass-strong)}
.av.bot{background:linear-gradient(135deg,#7a5cff,#b06cff)!important}
.item .meta{flex:1;overflow:hidden}
.item .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.item .name .bot-tag{font-size:9px;font-weight:800;background:var(--tg-blue);color:#fff;padding:2px 6px;border-radius:8px}
.item .preview{font-size:12px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini-btn{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--tg-blue),var(--tg-blue-dark));color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s}
.mini-btn:hover{transform:scale(1.12)}
.empty{padding:36px 20px;text-align:center;color:var(--text-soft);font-size:13px}
.chat{flex:1;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--chat-bg)}
.chat-head{padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(16px)}
.chat-head .av{width:44px;height:44px;font-size:16px}
.chat-head .title{flex:1}
.chat-head .title .n{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.chat-head .title .n .bot-tag{font-size:10px;font-weight:800;background:var(--tg-blue);color:#fff;padding:2px 7px;border-radius:8px}
.chat-head .title .st{font-size:12px;color:#2ecc71;font-weight:600;display:flex;align-items:center;gap:5px}
.chat-head .title .st::before{content:'';width:7px;height:7px;border-radius:50%;background:#2ecc71;box-shadow:0 0 8px #2ecc71}
.chat-head .title .st.offline{color:var(--text-soft)}
.chat-head .title .st.offline::before{background:#aaa;box-shadow:none}
.messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.messages::-webkit-scrollbar{width:6px}
.messages::-webkit-scrollbar-thumb{background:rgba(51,144,236,.35);border-radius:3px}
.date-sep{align-self:center;font-size:11px;font-weight:700;color:#fff;background:rgba(51,144,236,.55);backdrop-filter:blur(8px);padding:4px 14px;border-radius:12px;margin:8px 0}
.msg{max-width:70%;padding:9px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word;position:relative;animation:msgIn .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg.sent{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--tg-blue),var(--tg-blue-dark));border-bottom-right-radius:4px;box-shadow:0 3px 12px rgba(51,144,236,.35)}
.msg.recv{align-self:flex-start;color:var(--text);background:var(--bubble-in);border:1px solid var(--glass-border);border-bottom-left-radius:4px}
.msg.bot-msg{background:linear-gradient(135deg,#7a5cff,#b06cff);color:#fff;border:none}
.msg .t{font-size:10px;opacity:.75;margin-top:3px;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.msg.sent .t{color:rgba(255,255,255,.85)}
.msg .read{font-size:11px}
.input-row{padding:12px 16px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(16px)}
.input-row input{flex:1;padding:12px 18px;border-radius:22px;font-size:14px;border:1px solid var(--glass-border);background:rgba(255,255,255,.7);color:var(--text);outline:none;transition:.2s}
body.dark .input-row input{background:rgba(30,45,70,.8)}
.input-row input:focus{border-color:var(--tg-blue);box-shadow:0 0 0 3px rgba(51,144,236,.15)}
.send-btn{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--tg-blue),var(--tg-blue-dark));color:#fff;font-size:18px;box-shadow:0 6px 20px rgba(51,144,236,.45);transition:.2s;flex-shrink:0}
.send-btn:hover{transform:scale(1.08) rotate(8deg)}
.no-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-soft);gap:14px}
.no-chat .emoji{font-size:70px;opacity:.6;animation:f1 4s ease-in-out infinite}
.no-chat .txt{font-size:15px;font-weight:600}
.emoji-panel{position:absolute;bottom:78px;left:16px;right:16px;padding:14px;border-radius:18px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;z-index:20;max-height:200px;overflow-y:auto;animation:popIn .25s ease}
.emoji-panel span{font-size:22px;text-align:center;cursor:pointer;padding:4px;border-radius:8px;transition:.15s}
.emoji-panel span:hover{background:rgba(255,255,255,.4);transform:scale(1.25)}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:13px 26px;border-radius:16px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--tg-blue),var(--tg-blue-dark));box-shadow:0 10px 32px rgba(51,144,236,.5);z-index:999;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes toastIn{from{opacity:0;top:-50px;transform:translateX(-50%) scale(.9)}to{opacity:1;top:24px;transform:translateX(-50%) scale(1)}}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.5);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;animation:popIn .2s}
.modal{width:340px;padding:26px;border-radius:22px}
.modal h3{margin-bottom:16px;font-size:18px}
.modal .colors{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
.modal .colors div{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;transition:.2s;border:3px solid transparent}
.modal .colors div:hover{transform:scale(1.1)}
.modal .colors div.sel{border-color:#fff;box-shadow:0 0 0 2px var(--tg-blue)}
@media(max-width:760px){.app{padding:6px;gap:6px}.sidebar{width:120px}.brand,.search-row,.tabs,.item .preview{display:none}.item{padding:6px;justify-content:center}}
</style>
</head>
<body class="light-bg">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="authScreen" class="auth-wrap">
  <div class="auth-card glass">
    <h1>MoggoЧат</h1>
    <p class="sub">Real-time · Сервер · Liquid Glass ✨</p>
    <div id="authErr" class="err"></div>
    <div id="loginForm">
      <input class="field" id="loginUser" placeholder="Логин" maxlength="20">
      <input class="field" id="loginPass" type="password" placeholder="Пароль" maxlength="40">
      <button class="btn-primary" onclick="doLogin()">Войти</button>
      <div class="switch-link">Нет аккаунта? <a onclick="showReg()">Создать</a></div>
    </div>
    <div id="regForm" class="hidden">
      <input class="field" id="regUser" placeholder="Придумайте логин" maxlength="20">
      <input class="field" id="regPass" type="password" placeholder="Пароль (мин. 4)" maxlength="40">
      <input class="field" id="regPass2" type="password" placeholder="Повторите пароль" maxlength="40">
      <button class="btn-primary" onclick="doRegister()">Создать аккаунт</button>
      <div class="switch-link">Уже есть? <a onclick="showLogin()">Войти</a></div>
    </div>
  </div>
</div>
<div id="appScreen" class="app glass hidden">
  <div class="sidebar">
    <div class="side-head"><div class="brand">MoggoЧат</div><div class="head-actions"><button class="icon-btn" onclick="toggleTheme()">🌙</button><button class="icon-btn" onclick="doLogout()">⏻</button><div class="my-avatar" id="myAv" onclick="openProfile()">?</div></div></div>
    <div class="search-row"><input id="search" placeholder="🔍 Поиск..." oninput="renderList()"></div>
    <div class="tabs"><div class="tab active" data-tab="friends" onclick="switchTab('friends')">Чаты</div><div class="tab" data-tab="all" onclick="switchTab('all')">Люди</div></div>
    <div class="list" id="list"></div>
  </div>
  <div class="chat">
    <div class="no-chat" id="noChat"><div class="emoji">💬</div><div class="txt">Выберите чат</div></div>
    <div id="activeChat" class="hidden" style="flex:1;display:flex;flex-direction:column;height:100%">
      <div class="chat-head"><div class="av" id="chatAv">?</div><div class="title"><div class="n" id="chatName"></div><div class="st" id="chatStatus">в сети</div></div><button class="icon-btn" onclick="toggleFriendChat()">👥</button></div>
      <div class="messages" id="messages"></div>
      <div class="input-row"><button class="icon-btn" onclick="toggleEmoji()">😀</button><input id="msgInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendMsg()"><button class="send-btn" onclick="sendMsg()">➤</button></div>
      <div class="emoji-panel glass hidden" id="emojiPanel"></div>
    </div>
  </div>
</div>
<script>
const socket = io();
let me = null; let users = {}; let onlineSet = new Set(); let chatWith = null; let tab = 'friends'; let emojiOpen = false; let myFriends = [];
const AV_COLORS = ['#3390ec','#4a7bc8','#7ba7e8','#5b8def','#6a5acd','#1e90ff','#3a6bc4','#4682b4'];
const SUPPORT_BOT = '__support__'; const BOT_NAME = 'Поддержка MoggoЧат'; const CREATOR = 'mogg';
const EMOJIS = ['😀','😁','😂','🤣','😊','😍','😘','😎','🤔','😴','😭','😡','🥳','🤗','😇','🙃','😉','😌','🤩','😱','👍','👎','👏','🙏','💪','🔥','💯','❤️','💙','💎','✨','🎉','🎁','☕','🍕','⚽','🎮','🎵','🌈','⭐'];
function showReg(){loginForm.classList.add('hidden');regForm.classList.remove('hidden');authErr.textContent=''}
function showLogin(){regForm.classList.add('hidden');loginForm.classList.remove('hidden');authErr.textContent=''}
function doRegister(){const u=regUser.value.trim(),p=regPass.value,p2=regPass2.value;if(u.length<3)return authErr.textContent='Логин ≥ 3';if(p.length<4)return authErr.textContent='Пароль ≥ 4';if(p!==p2)return authErr.textContent='Пароли не совпадают';socket.emit('register',{username:u,password:p},res=>{if(!res.ok)return authErr.textContent=res.error;authErr.style.color='#27ae60';authErr.textContent='Аккаунт создан!';setTimeout(()=>{showLogin();loginUser.value=u;authErr.textContent='';authErr.style.color=''},900);});}
function doLogin(){const u=loginUser.value.trim(),p=loginPass.value;socket.emit('login',{username:u,password:p},res=>{if(!res.ok)return authErr.textContent=res.error;me=u;users=res.users;myFriends=res.friends;localStorage.setItem('mg_session',u);openApp();});}
function doLogout(){socket.emit('logout');localStorage.removeItem('mg_session');me=null;chatWith=null;appScreen.classList.add('hidden');authScreen.classList.remove('hidden');loginPass.value='';}
function openApp(){authScreen.classList.add('hidden');appScreen.classList.remove('hidden');myAv.textContent=me[0].toUpperCase();myAv.style.background=`linear-gradient(135deg,${users[me].color},${shade(users[me].color,30)})`;renderList();closeChat();}
function switchTab(t){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));renderList()}
function chatKey(a,b){return [a,b].sort().join('|')}
function loadMessages(withUser){return new Promise(res=>{if(withUser===SUPPORT_BOT){socket.emit('getSupportMessages',res);}else{socket.emit('getMessages',{with:withUser},res);}});}
function renderList(){const q=search.value.trim().toLowerCase();list.innerHTML='';const botEl=document.createElement('div');botEl.className='item'+(chatWith===SUPPORT_BOT?' active':'');botEl.innerHTML=`<div class="av bot">🤖<div class="dot"></div></div><div class="meta"><div class="name">${BOT_NAME} <span class="bot-tag">BOT</span></div><div class="preview">Напишите — уйдёт создателю</div></div>`;botEl.onclick=()=>openChat(SUPPORT_BOT);list.appendChild(botEl);if(tab==='friends'){let arr=[...myFriends];if(q)arr=arr.filter(u=>u.toLowerCase().includes(q));if(!arr.length && !q){list.innerHTML+='<div class="empty">Добавьте друзей во вкладке «Люди»</div>';return;}arr.forEach(u=>{const color=users[u]?.color||'#4a7bc8';const isOnline=onlineSet.has(u);const el=document.createElement('div');el.className='item'+(chatWith===u?' active':'');el.innerHTML=`<div class="av" style="background:linear-gradient(135deg,${color},${shade(color,30)})">${u[0].toUpperCase()}<div class="dot ${isOnline?'':'offline'}"></div></div><div class="meta"><div class="name">${escapeHtml(u)}</div><div class="preview">${isOnline?'в сети':'не в сети'}</div></div>`;el.onclick=()=>openChat(u);list.appendChild(el);});}else{let arr=Object.keys(users).filter(u=>u!==me && !myFriends.includes(u));if(q)arr=arr.filter(u=>u.toLowerCase().includes(q));if(!arr.length){list.innerHTML+='<div class="empty">Никого не найдено</div>';return}arr.forEach(u=>{const color=users[u].color||'#4a7bc8';const isOnline=onlineSet.has(u);const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="av" style="background:linear-gradient(135deg,${color},${shade(color,30)})">${u[0].toUpperCase()}<div class="dot ${isOnline?'':'offline'}"></div></div><div class="meta"><div class="name">${escapeHtml(u)}</div><div class="preview">${isOnline?'в сети':'не в сети'}</div></div><button class="mini-btn">+</button>`;el.querySelector('.mini-btn').onclick=e=>{e.stopPropagation();addFriend(u)};el.onclick=()=>addFriend(u);list.appendChild(el);});}}
function addFriend(u){socket.emit('addFriend',{friend:u},res=>{if(res.ok){myFriends=res.friends;toast('✅ '+u+' добавлен');renderList()}});}
function toggleFriendChat(){if(!chatWith||chatWith===SUPPORT_BOT)return;if(myFriends.includes(chatWith)){socket.emit('removeFriend',{friend:chatWith},res=>{if(res.ok){myFriends=res.friends;toast('❌ '+chatWith+' удалён');renderList()}});}else{socket.emit('addFriend',{friend:chatWith},res=>{if(res.ok){myFriends=res.friends;toast('✅ '+chatWith+' добавлен');renderList()}});}}
function openChat(u){chatWith=u;noChat.classList.add('hidden');activeChat.classList.remove('hidden');if(u===SUPPORT_BOT){chatName.innerHTML=BOT_NAME+' <span class="bot-tag">BOT</span>';chatStatus.textContent='служба поддержки';chatStatus.className='st';chatAv.textContent='🤖';chatAv.className='av bot';chatAv.style.background='linear-gradient(135deg,#7a5cff,#b06cff)';}else{const color=users[u].color||'#4a7bc8';chatName.textContent=u;const isOnline=onlineSet.has(u);chatStatus.textContent=isOnline?'в сети':'не в сети';chatStatus.className='st'+(isOnline?'':' offline');chatAv.textContent=u[0].toUpperCase();chatAv.className='av';chatAv.style.background=`linear-gradient(135deg,${color},${shade(color,30)})`;}loadMessages(u).then(arr=>renderMessages(arr));renderList();setTimeout(()=>msgInput.focus(),100);}
function closeChat(){chatWith=null;noChat.classList.remove('hidden');activeChat.classList.add('hidden');emojiPanel.classList.add('hidden');emojiOpen=false;}
function renderMessages(arr){messages.innerHTML='';if(!arr||!arr.length){messages.innerHTML=`<div class="empty">${chatWith===SUPPORT_BOT?'👋 Напишите в поддержку':'Начните диалог 👋'}</div>`;return;}let lastDate='';arr.forEach(m=>{const d=new Date(m.created_at*1000);const ds=dateLabel(d);if(ds!==lastDate){lastDate=ds;const sep=document.createElement('div');sep.className='date-sep';sep.textContent=ds;messages.appendChild(sep);}const isMe=m.sender===me;const isBot=m.sender===SUPPORT_BOT;let cls='msg '+(isBot?'bot-msg':isMe?'sent':'recv');const el=document.createElement('div');el.className=cls;el.innerHTML=`${m.from_creator?'<div style="font-size:10px;opacity:.8;margin-bottom:3px">👤 Поддержка:</div>':''}${escapeHtml(m.text)}<div class="t">${m.time||formatTime(d)} ${isMe?'<span class="read">✓✓</span>':''}</div>`;messages.appendChild(el);});messages.scrollTop=messages.scrollHeight;}
function sendMsg(){const text=msgInput.value.trim();if(!text||!chatWith)return;socket.emit('sendMessage',{to:chatWith,text});msgInput.value='';emojiPanel.classList.add('hidden');emojiOpen=false;}
function toggleEmoji(){emojiOpen=!emojiOpen;emojiPanel.classList.toggle('hidden',!emojiOpen);if(emojiOpen&&!emojiPanel.children.length){EMOJIS.forEach(e=>{const s=document.createElement('span');s.textContent=e;s.onclick=()=>{msgInput.value+=e;msgInput.focus()};emojiPanel.appendChild(s);});}}
function openProfile(){const my=users[me];const modal=document.createElement('div');modal.className='modal-bg';modal.innerHTML=`<div class="modal glass"><h3>🎨 Аватар — ${me}</h3><div class="colors">${AV_COLORS.map(c=>`<div data-c="${c}" style="background:linear-gradient(135deg,${c},${shade(c,30)})" class="${c===my.color?'sel':''}"></div>`).join('')}</div><button class="btn-primary" onclick="this.closest('.modal-bg').remove()">Готово</button></div>`;modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.querySelectorAll('.colors div').forEach(d=>{d.onclick=()=>{socket.emit('setColor',{color:d.dataset.c},res=>{if(res.ok){users[me].color=d.dataset.c;myAv.style.background=`linear-gradient(135deg,${d.dataset.c},${shade(d.dataset.c,30)})`;modal.querySelectorAll('.colors div').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');renderList();}});};});document.body.appendChild(modal);}
function toggleTheme(){document.body.classList.toggle('dark');document.body.classList.toggle('light-bg',!document.body.classList.contains('dark'));localStorage.setItem('mg_dark',document.body.classList.contains('dark')?'1':'0');}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=(n>>16)+p,g=((n>>8)&255)+p,b=(n&255)+p;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(d){const t=new Date();t.setHours(0,0,0,0);const y=new Date(t);y.setDate(y.getDate()-1);const dd=new Date(d);dd.setHours(0,0,0,0);if(dd.getTime()===t.getTime())return 'Сегодня';if(dd.getTime()===y.getTime())return 'Вчера';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}
function formatTime(d){return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';t.style.transform='translate(-50%,-20px)';setTimeout(()=>t.remove(),300)},1800);}
socket.on('online',arr=>{onlineSet=new Set(arr);renderList();if(chatWith&&chatWith!==SUPPORT_BOT){const isOnline=onlineSet.has(chatWith);chatStatus.textContent=isOnline?'в сети':'не в сети';chatStatus.className='st'+(isOnline?'':' offline');}});
socket.on('users_update',u=>{users=u;if(me)renderList();});
socket.on('new_message',m=>{if(chatWith&&(m.sender===chatWith||m.receiver===chatWith)){loadMessages(chatWith).then(renderMessages);}renderList();});
socket.on('new_ticket',t=>{if(me===CREATOR){toast('📨 Новое сообщение от '+t.sender);}});
window.addEventListener('load',()=>{if(localStorage.getItem('mg_dark')==='1'){document.body.classList.add('dark');document.body.classList.remove('light-bg')}loginPass.addEventListener('keypress',e=>{if(e.key==='Enter')doLogin()});regPass2.addEventListener('keypress',e=>{if(e.key==='Enter')doRegister()});});
</script>
